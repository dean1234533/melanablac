name = "melanablac"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# After logging in with the dbs_workouts@yahoo.com Cloudflare account:
#   npx wrangler d1 create melanablac        -> paste database_id below
#   npx wrangler r2 bucket create melanablac-media
[[d1_databases]]
binding = "DB"
database_name = "melanablac"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "melanablac-media"

[vars]
ADMIN_EMAIL = "dbs_workouts@yahoo.com"
SITE_URL = "https://melanablac.pages.dev"
RESEND_FROM = "MelanaBlac <onboarding@resend.dev>"
# Secrets (wrangler pages secret put NAME): RESEND_API_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK, STRIPE_SECRET_KEY (optional)
