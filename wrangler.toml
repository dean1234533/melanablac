name = "melanablac"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# After logging in with the dbs_workouts@yahoo.com Cloudflare account:
# Database created on the dbs_workouts@yahoo.com account:
[[d1_databases]]
binding = "DB"
database_name = "melanablac"
database_id = "d576d5a5-df26-4c11-a3e3-d99fb38d1a73"

# Optional: once R2 is enabled on the account, create a bucket and uncomment to store images there
# instead of in D1:
#   npx wrangler r2 bucket create melanablac-media
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "melanablac-media"

[vars]
ADMIN_USERNAME = "admin"
ADMIN_EMAIL = "dbs_workouts@yahoo.com"
# Website enquiries are emailed here (falls back to ADMIN_EMAIL if blank):
NOTIFY_EMAIL = "dean@dean-da-dev.co.uk"
SITE_URL = "https://melanablac.pages.dev"
RESEND_FROM = "MelanaBlac <onboarding@resend.dev>"
# Secrets (wrangler pages secret put NAME): RESEND_API_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK, STRIPE_SECRET_KEY (optional)
